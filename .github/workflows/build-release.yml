name: Build Signed Release APK

on:
  workflow_dispatch:

jobs:
  build-release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Create .env from Example if not present
        run: |
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          elif [ ! -f ".env" ]; then
            touch .env
          fi

      - name: Generate Gradle Wrapper if missing
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 9.4.1
          fi
          true

      - name: Beri Izin Akses Gradle
        run: chmod +x gradlew

      - name: Run Unit Tests & Capture Screenshots
        run: |
          ./gradlew recordRoborazziDebug testDebugUnitTest --no-daemon --stacktrace

      - name: Build signed Release APK
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "Keystore release.jks decoded successfully."
            export RELEASE_STORE_FILE="$RUNNER_TEMP/release.jks"
          else
            echo "No KEYSTORE_BASE64 secret provided."
          fi
          if [ -f "$RELEASE_STORE_FILE" ]; then
            echo "release.jks file exists."
            if [ -n "$RELEASE_STORE_PASSWORD" ]; then
              echo "STORE_PASSWORD secret is configured."
            else
              echo "WARNING: STORE_PASSWORD secret is empty. Release build will fallback to debug signing."
            fi
            if [ -n "$RELEASE_KEY_ALIAS" ]; then
              echo "KEY_ALIAS secret is configured."
            else
              echo "WARNING: KEY_ALIAS secret is empty. Defaulting alias to 'upload'."
            fi
          else
            echo "release.jks not found"
          fi
          ./gradlew assembleRelease --no-daemon --no-configuration-cache --stacktrace

      - name: Verify APK signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v6
        with:
          name: template-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload UI Screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: app-ui-screenshots
          path: |
            app/src/test/screenshots/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload UI Screenshots roborazzi
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: app-ui-screenshots-roborazzi
          path: |
            app/build/outputs/roborazzi/*.png
          if-no-files-found: ignore
          retention-days: 7