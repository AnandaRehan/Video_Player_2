org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true

# Roborazzi: makes a plain `./gradlew testDebugUnitTest` record screenshots into
# app/src/test/screenshots (see roborazzi { outputDir } in app/build.gradle.kts).
# For regression checks, replace with roborazzi.test.verify=true.
roborazzi.test.record=true
